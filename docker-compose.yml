# =============================================================
# Hashiji Cafe - Docker Compose cho Demo DBMS
# Dựng PostgreSQL 15 + pgAdmin 4 cục bộ
# =============================================================
version: '3.8'

services:
  # ── PostgreSQL 15 ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: hashiji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cafe_db
      POSTGRES_USER: cafe_admin
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tự động chạy script SQL khi khởi tạo lần đầu
      - ./src/main/resources/schema-advanced.sql:/docker-entrypoint-initdb.d/01-schema-advanced.sql
      - ./src/main/resources/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe_admin -d cafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── pgAdmin 4 (Giao diện quản trị trực quan) ──────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hashiji-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hashiji.cafe
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend + Frontend (Spring Boot App) ──────────────────
  hashiji-app:
    build: .
    container_name: hashiji-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Kết nối tới service 'postgres' trong cùng mạng Docker thay vì 'localhost'
      DB_URL: jdbc:postgresql://postgres:5432/cafe_db
      DB_USERNAME: cafe_admin
      DB_PASSWORD: 123
      APP_PROFILE: dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
